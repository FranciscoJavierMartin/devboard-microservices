basePath: /api/v1
definitions:
  domain.TaskStatus:
    enum:
    - todo
    - in_progress
    - done
    type: string
    x-enum-varnames:
    - TaskStatusTodo
    - TaskStatusInProgress
    - TaskStatusDone
  handler.PaginatedResponse-handler_commentResponse:
    properties:
      data:
        items:
          $ref: '#/definitions/handler.commentResponse'
        type: array
      hasMore:
        type: boolean
      nextCursor:
        type: string
    type: object
  handler.PaginatedResponse-handler_memberResponse:
    properties:
      data:
        items:
          $ref: '#/definitions/handler.memberResponse'
        type: array
      hasMore:
        type: boolean
      nextCursor:
        type: string
    type: object
  handler.PaginatedResponse-handler_projectResponse:
    properties:
      data:
        items:
          $ref: '#/definitions/handler.projectResponse'
        type: array
      hasMore:
        type: boolean
      nextCursor:
        type: string
    type: object
  handler.PaginatedResponse-handler_taskResponse:
    properties:
      data:
        items:
          $ref: '#/definitions/handler.taskResponse'
        type: array
      hasMore:
        type: boolean
      nextCursor:
        type: string
    type: object
  handler.PaginatedResponse-handler_workspaceResponse:
    properties:
      data:
        items:
          $ref: '#/definitions/handler.workspaceResponse'
        type: array
      hasMore:
        type: boolean
      nextCursor:
        type: string
    type: object
  handler.ProblemDetails:
    properties:
      detail:
        type: string
      errors:
        items:
          $ref: '#/definitions/validator.ValidationError'
        type: array
      instance:
        type: string
      status:
        type: integer
      title:
        type: string
      type:
        type: string
    type: object
  handler.addMemberRequest:
    properties:
      role:
        enum:
        - admin
        - member
        - viewer
        type: string
      user_id:
        type: string
    required:
    - role
    - user_id
    type: object
  handler.assignTaskRequest:
    properties:
      assignee_id:
        type: string
    required:
    - assignee_id
    type: object
  handler.commentResponse:
    properties:
      author_id:
        type: string
      content:
        type: string
      created_at:
        type: string
      id:
        type: string
      task_id:
        type: string
      updated_at:
        type: string
    type: object
  handler.createCommentRequest:
    properties:
      content:
        maxLength: 5000
        minLength: 1
        type: string
    required:
    - content
    type: object
  handler.createProjectRequest:
    properties:
      description:
        maxLength: 500
        type: string
      name:
        maxLength: 100
        minLength: 2
        type: string
      workspace_id:
        type: string
    required:
    - name
    - workspace_id
    type: object
  handler.createTaskRequest:
    properties:
      description:
        maxLength: 2000
        type: string
      project_id:
        type: string
      title:
        maxLength: 200
        minLength: 3
        type: string
    required:
    - project_id
    - title
    type: object
  handler.createUserRequest:
    properties:
      email:
        type: string
      name:
        maxLength: 100
        minLength: 2
        type: string
      password:
        minLength: 8
        type: string
    required:
    - email
    - name
    - password
    type: object
  handler.createWorkspaceRequest:
    properties:
      description:
        maxLength: 500
        type: string
      name:
        maxLength: 100
        minLength: 2
        type: string
    required:
    - name
    type: object
  handler.healthResponse:
    properties:
      status:
        type: string
      version:
        type: string
    type: object
  handler.loginRequest:
    properties:
      email:
        type: string
      password:
        maxLength: 72
        minLength: 8
        type: string
    required:
    - email
    - password
    type: object
  handler.memberResponse:
    properties:
      id:
        type: string
      joined_at:
        type: string
      role:
        type: string
      user_id:
        type: string
      workspace_id:
        type: string
    type: object
  handler.projectResponse:
    properties:
      created_at:
        type: string
      created_by:
        type: string
      description:
        type: string
      id:
        type: string
      name:
        type: string
      workspace_id:
        type: string
    type: object
  handler.refreshRequest:
    properties:
      refresh_token:
        type: string
    required:
    - refresh_token
    type: object
  handler.registerRequest:
    properties:
      email:
        type: string
      name:
        maxLength: 100
        minLength: 2
        type: string
      password:
        maxLength: 72
        minLength: 8
        type: string
    required:
    - email
    - name
    - password
    type: object
  handler.taskResponse:
    properties:
      assignee_id:
        type: string
      created_at:
        type: string
      created_by:
        type: string
      description:
        type: string
      id:
        type: string
      project_id:
        type: string
      status:
        $ref: '#/definitions/domain.TaskStatus'
      title:
        type: string
      updated_at:
        type: string
    type: object
  handler.tokenResponse:
    properties:
      access_token:
        type: string
      expires_in:
        type: integer
      refresh_token:
        type: string
      token_type:
        type: string
    type: object
  handler.updateStatusRequest:
    properties:
      status:
        $ref: '#/definitions/domain.TaskStatus'
    required:
    - status
    type: object
  handler.userResponse:
    properties:
      email:
        type: string
      id:
        type: string
      name:
        type: string
    type: object
  handler.workspaceResponse:
    properties:
      created_at:
        type: string
      created_by:
        type: string
      description:
        type: string
      id:
        type: string
      name:
        type: string
      slug:
        type: string
    type: object
  validator.ValidationError:
    properties:
      field:
        type: string
      message:
        type: string
    type: object
host: localhost:8080
info:
  contact: {}
  description: API REST for project management
  title: Devboard API
  version: "1.0"
paths:
  /auth/login:
    post:
      consumes:
      - application/json
      description: Verify credentials and return access token
      parameters:
      - description: Credentials
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.loginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.tokenResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handler.ProblemDetails'
      summary: Sign In session
      tags:
      - auth
  /auth/logout:
    post:
      consumes:
      - application/json
      description: Revoke user refresh token
      parameters:
      - description: Refresh token to be revoked
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.refreshRequest'
      produces:
      - application/json
      responses:
        "204":
          description: No content
      summary: Sign out session
      tags:
      - auth
  /auth/refresh:
    post:
      consumes:
      - application/json
      description: Renew the pair of tokens using a valid refresh token
      parameters:
      - description: Refresh token
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.refreshRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.tokenResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handler.ProblemDetails'
      summary: Refresh tokens
      tags:
      - auth
  /auth/register:
    post:
      consumes:
      - application/json
      description: Create new user and returns access token
      parameters:
      - description: register data
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.registerRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/handler.tokenResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.ProblemDetails'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/handler.ProblemDetails'
      summary: Register user
      tags:
      - auth
  /comments/{id}:
    delete:
      description: Remove comment. Only author can perform this.
      parameters:
      - description: comment ID
        in: path
        name: id
        required: true
        type: string
      responses:
        "204":
          description: No content
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/handler.ProblemDetails'
      security:
      - BearerAuth: []
      summary: Remove comment
      tags:
      - comments
  /health:
    get:
      description: Verify that server is running and accepting requests
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.healthResponse'
      summary: Health check
      tags:
      - system
  /projects:
    post:
      consumes:
      - application/json
      description: Create new project inside workspace
      parameters:
      - description: Project data
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.createProjectRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/handler.projectResponse'
      security:
      - BearerAuth: []
      summary: Create project
      tags:
      - projects
  /projects/{id}:
    get:
      description: Retrieve project by ID
      parameters:
      - description: Project ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.projectResponse'
      security:
      - BearerAuth: []
      summary: Get project
      tags:
      - projects
  /projects/{id}/tasks:
    get:
      description: Returns all tasks that belongs to a project
      parameters:
      - description: Project ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.PaginatedResponse-handler_taskResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handler.ProblemDetails'
      security:
      - BearerAuth: []
      summary: List all tasks from a project
      tags:
      - tasks
  /tasks:
    post:
      consumes:
      - application/json
      description: Create a new task
      parameters:
      - description: Task data
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.createTaskRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/handler.taskResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.ProblemDetails'
      security:
      - BearerAuth: []
      summary: Create task
      tags:
      - tasks
  /tasks/{id}:
    get:
      description: Retrieve a task by its ID
      parameters:
      - description: task ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.taskResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handler.ProblemDetails'
      security:
      - BearerAuth: []
      summary: Retrieve task by ID
      tags:
      - tasks
  /tasks/{id}/assign:
    put:
      consumes:
      - application/json
      description: Assign task to a team member
      parameters:
      - description: Task ID
        in: path
        name: id
        required: true
        type: string
      - description: User ID
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.assignTaskRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.taskResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.ProblemDetails'
      security:
      - BearerAuth: []
      summary: Assign task
      tags:
      - tasks
  /tasks/{id}/comments:
    get:
      description: List all comments from a task
      parameters:
      - description: task ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.PaginatedResponse-handler_commentResponse'
      security:
      - BearerAuth: []
      summary: List comments
      tags:
      - comments
    post:
      consumes:
      - application/json
      description: Add comment to task
      parameters:
      - description: Task ID
        in: path
        name: id
        required: true
        type: string
      - description: Content
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.createCommentRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/handler.commentResponse'
      security:
      - BearerAuth: []
      summary: Create comment
      tags:
      - comments
  /tasks/{id}/status:
    put:
      consumes:
      - application/json
      description: Update task to a new status on the board
      parameters:
      - description: Task ID
        in: path
        name: id
        required: true
        type: string
      - description: New status
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.updateStatusRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.taskResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.ProblemDetails'
      security:
      - BearerAuth: []
      summary: Update task status
      tags:
      - tasks
  /users:
    post:
      consumes:
      - application/json
      description: Register new user
      parameters:
      - description: User data
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.createUserRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/handler.userResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.ProblemDetails'
      summary: Create user
      tags:
      - users
  /users/{id}:
    get:
      description: Get user by Id
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.userResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handler.ProblemDetails'
      summary: Get user
      tags:
      - users
  /workspaces:
    get:
      description: List all workspaces which user is member
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.PaginatedResponse-handler_workspaceResponse'
      security:
      - BearerAuth: []
      summary: List my workspaces
      tags:
      - workspaces
    post:
      consumes:
      - application/json
      description: Create new workspace. Author is assigned as admin.
      parameters:
      - description: Workspace data
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.createWorkspaceRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/handler.workspaceResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.ProblemDetails'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/handler.ProblemDetails'
      security:
      - BearerAuth: []
      summary: Create workspace
      tags:
      - workspaces
  /workspaces/{id}:
    get:
      description: Get a workspace. Only accesible by workspace's members
      parameters:
      - description: Workspace ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.workspaceResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/handler.ProblemDetails'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handler.ProblemDetails'
      security:
      - BearerAuth: []
      summary: Get workspace
      tags:
      - workspaces
  /workspaces/{id}/members:
    get:
      description: List all members from workspace
      parameters:
      - description: Workspace ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.PaginatedResponse-handler_memberResponse'
      security:
      - BearerAuth: []
      summary: List member
      tags:
      - workspaces
    post:
      consumes:
      - application/json
      description: Add member to workspace. Only admin can perform this.
      parameters:
      - description: workspace ID
        in: path
        name: id
        required: true
        type: string
      - description: Data of the member
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.addMemberRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/handler.memberResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/handler.ProblemDetails'
      security:
      - BearerAuth: []
      summary: Add member
      tags:
      - workspaces
  /workspaces/{id}/members/{userID}:
    delete:
      description: Remove user from workspace. Only admin can perform this.
      parameters:
      - description: Workspace ID
        in: path
        name: id
        required: true
        type: string
      - description: User ID to be removed
        in: path
        name: userID
        required: true
        type: string
      responses:
        "204":
          description: No content
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/handler.ProblemDetails'
      security:
      - BearerAuth: []
      summary: Remove memeber
      tags:
      - workspaces
  /workspaces/{id}/projects:
    get:
      description: List all projects from workspace
      parameters:
      - description: Workspace ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.PaginatedResponse-handler_projectResponse'
      security:
      - BearerAuth: []
      summary: List projects from workspace
      tags:
      - projects
securityDefinitions:
  BearerAuth:
    description: 'Write Bearer token with format: Bearer {token}'
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
